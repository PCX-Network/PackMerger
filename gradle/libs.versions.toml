# Gradle version catalog — single source of truth for dependency versions.
# Referenced from build.gradle as `libs.*`. Bumps here are picked up by
# Dependabot (see .github/dependabot.yml).
[versions]
# Paper API. New (2026+) year-based scheme: <year>.<drop>.<patch>.build.<n>-<stage>.
# `.build.+` resolves the latest published build of 26.1.2. Pin to a specific
# `26.1.2.build.<n>-stable` if you need fully reproducible compiles.
paper = "26.1.2.build.+"
commons-compress = "1.28.0"
# MinIO 9.x is a major bump (compiled against in S3UploadProvider); kept on the
# 8.x line here and left for Dependabot to propose 9.x under CI verification.
minio = "8.6.0"
gson = "2.14.0"
# JUnit 6.x is a major bump; kept on 5.x here, Dependabot proposes 6.x under CI.
junit = "6.1.0"
velocity = "3.4.0"
shadow = "9.4.2"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
minio = { module = "io.minio:minio", version.ref = "minio" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
