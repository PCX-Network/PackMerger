// Root aggregator for the PackMerger monorepo.
//
// Modules:
//   :plugin          — the Paper plugin (the shipped jar)
// Added in later phases: :common, :bedrock, :proxy-velocity, :proxy-bungee.
//
// Dependency versions live in the shared catalog at gradle/libs.versions.toml,
// which is available to every module.
allprojects {
    group = 'sh.pcx'
    version = '1.2.0'
}
